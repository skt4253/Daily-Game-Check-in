name: Daily Game Check-in

on:
  schedule:
    - cron: '30 16 * * *'  # 매일 UTC 16:30 = KST 01:30
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # 워크플로 재활성화(keepalive)용

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python checkin.py
        env:
          HOYO_COOKIE: ${{ secrets.HOYO_COOKIE }}
          SK_CRED: ${{ secrets.SK_CRED }}
          SK_GAME_ROLE: ${{ secrets.SK_GAME_ROLE }}
          SK_TOKEN: ${{ secrets.SK_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # 60일 비활성 자동 비활성화 방지: 실행될 때마다 자기 자신을 다시 활성화
      - name: Keep workflow alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/checkin.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
